<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1B3A">
<title>Badminton Rating</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🏸</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --navy:#0B1B3A; --navy2:#152E58; --blue:#2563EB; --blue2:#3B82F6; --blue-soft:#EAF1FF;
  --green:#10B981; --green-soft:#E6F7F1; --amber:#F59E0B; --red:#EF4444;
  --bg:#F3F6FB; --card:#FFFFFF; --line:#E6EAF2; --text:#0F172A; --muted:#64748B;
  --r:18px; --sh:0 2px 8px rgba(15,23,42,.05), 0 12px 32px rgba(15,23,42,.07);
  --sh-sm:0 1px 3px rgba(15,23,42,.06), 0 4px 14px rgba(15,23,42,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans Thai','Inter',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit}
a{color:inherit;text-decoration:none}
.demo-banner{position:sticky;top:0;z-index:60;background:linear-gradient(90deg,#F59E0B,#F97316);color:#fff;font-weight:700;letter-spacing:.06em;text-align:center;padding:7px 12px;font-size:12px}
.shell{display:flex;min-height:100vh}
/* ---------- SIDEBAR ---------- */
.sidebar{display:none;width:262px;flex:0 0 262px;background:var(--navy);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;flex-direction:column;gap:18px}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 14px}
.brand .logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--green));display:grid;place-items:center;font-size:21px}
.brand b{display:block;font-size:15.5px;letter-spacing:.2px}
.brand small{color:#9FB3D1;font-size:11.5px}
.side-nav{display:flex;flex-direction:column;gap:4px}
.side-nav a{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;color:#C7D5EA;font-weight:600;font-size:14px;transition:.18s}
.side-nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.side-nav a.on{background:linear-gradient(135deg,var(--blue),#1D4ED8);color:#fff;box-shadow:0 8px 20px rgba(37,99,235,.35)}
.side-foot{margin-top:auto;background:rgba(255,255,255,.06);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.side-foot small{color:#9FB3D1;font-size:11px;display:block}
/* ---------- MAIN ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:rgba(243,246,251,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:58px}
.topbar h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.2px}
.topbar .sub{font-size:11.5px;color:var(--muted);font-weight:500}
.topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.view{padding:16px;max-width:1080px;width:100%;margin:0 auto;padding-bottom:110px}
@media(min-width:960px){.sidebar{display:flex}.view{padding:24px 28px 48px}.topbar{padding:14px 28px}}
/* ---------- BOTTOM NAV ---------- */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:10.5px;font-weight:600;transition:.18s}
.bottomnav a.on{color:var(--blue);background:var(--blue-soft)}
.bottomnav svg{width:21px;height:21px}
@media(min-width:960px){.bottomnav{display:none}}
/* ---------- CARDS ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);padding:18px}
.card+.card{margin-top:14px}
.card.flat{box-shadow:none}
.card-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-hd h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.2px}
.card-hd .act{margin-left:auto}
.hero{background:linear-gradient(140deg,var(--navy) 0%,var(--navy2) 55%,#1E4D8C 100%);color:#fff;border:none;border-radius:24px;padding:26px 22px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:after{content:"🏸";position:absolute;right:-14px;bottom:-26px;font-size:140px;opacity:.09;transform:rotate(-18deg)}
.hero h2{margin:0 0 4px;font-size:24px;font-weight:800;letter-spacing:-.4px}
.hero p{margin:0;color:#A9C0DE;font-size:13.5px}
/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:14px;padding:12px 18px;font-weight:700;font-size:14.5px;cursor:pointer;transition:.18s;background:#fff;color:var(--text);box-shadow:var(--sh-sm)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.btn:active{transform:translateY(0) scale(.985)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none}
.btn svg{width:18px;height:18px}
.btn-primary{background:linear-gradient(135deg,var(--blue2),#1D4ED8);color:#fff;box-shadow:0 8px 22px rgba(37,99,235,.3)}
.btn-green{background:linear-gradient(135deg,#34D399,var(--green));color:#fff;box-shadow:0 8px 22px rgba(16,185,129,.3)}
.btn-navy{background:var(--navy);color:#fff}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--navy)}
.btn-danger{background:#FEF2F2;color:var(--red);border-color:#FECACA;box-shadow:none}
.btn-lg{padding:17px 22px;font-size:16px;border-radius:17px;width:100%}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:11px}
.btn-row{display:grid;gap:11px;margin-top:14px}
@media(min-width:620px){.btn-row.two{grid-template-columns:1fr 1fr}}
/* ---------- FORM ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;background:#FAFBFE;outline:none;transition:.18s;font-weight:500}
.input:focus{border-color:var(--blue2);background:#fff;box-shadow:0 0 0 4px rgba(59,130,246,.12)}
.grid2{display:grid;gap:13px}
@media(min-width:560px){.grid2{grid-template-columns:1fr 1fr}}
/* ---------- CODE ---------- */
.code-box{text-align:center;padding:26px 16px;background:linear-gradient(140deg,var(--navy),#1E4D8C);border-radius:22px;color:#fff;box-shadow:var(--sh)}
.code-box .lbl{font-size:12px;color:#A9C0DE;letter-spacing:.14em;font-weight:700;text-transform:uppercase}
.code-digits{font-family:'Inter',monospace;font-size:clamp(38px,12vw,58px);font-weight:800;letter-spacing:.14em;margin:8px 0 2px}
.code-input{width:100%;text-align:center;font-family:'Inter',monospace;font-size:34px;font-weight:800;letter-spacing:.34em;padding:16px 10px;border:2px solid var(--line);border-radius:17px;background:#FAFBFE;outline:none}
.code-input:focus{border-color:var(--blue2);box-shadow:0 0 0 5px rgba(59,130,246,.13)}
/* ---------- AVATAR / PLAYER ---------- */
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:0 0 auto;box-shadow:inset 0 -2px 6px rgba(0,0,0,.14)}
.av.lg{width:76px;height:76px;font-size:27px}
.av.sm{width:32px;height:32px;font-size:12px}
.plist{display:flex;flex-direction:column;gap:9px}
.prow{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:15px;background:#fff;transition:.18s;cursor:pointer}
.prow:hover{border-color:#BFD3F6;box-shadow:var(--sh-sm);transform:translateY(-1px)}
.prow .nm{font-weight:700;font-size:14.5px}
.prow .meta{font-size:11.5px;color:var(--muted)}
.prow .tail{margin-left:auto;display:flex;align-items:center;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.dot.wait{background:#CBD5E1;box-shadow:0 0 0 3px #F1F5F9}
/* ---------- BADGES / STATS ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.03em}
.b-beginner{background:#F1F5F9;color:#475569}.b-novice{background:#E0F2FE;color:#0369A1}
.b-intermediate{background:#DCFCE7;color:#15803D}.b-advanced{background:#FEF3C7;color:#B45309}
.b-expert{background:#EDE9FE;color:#6D28D9}.b-elite{background:linear-gradient(135deg,#F59E0B,#EF4444);color:#fff}
.b-live{background:#DCFCE7;color:#15803D}.b-lobby{background:var(--blue-soft);color:#1D4ED8}
.b-done{background:#F1F5F9;color:#475569}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh-sm)}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px}
.stat .k svg{width:14px;height:14px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-1px;margin-top:3px;font-family:'Inter',sans-serif}
.stat .v small{font-size:13px;color:var(--muted);font-weight:600}
.up{color:var(--green)}.down{color:var(--red)}
.bigscore{font-family:'Inter',sans-serif;font-size:clamp(44px,13vw,64px);font-weight:800;letter-spacing:-2.5px;line-height:1}
.bigscore small{font-size:17px;color:var(--muted);font-weight:600;letter-spacing:0}
/* ---------- BARS ---------- */
.bar{height:9px;border-radius:99px;background:#EEF2F8;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue2),var(--green));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.skill{display:grid;grid-template-columns:118px 1fr 42px;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;font-weight:600}
.skill b{text-align:right;font-family:'Inter',sans-serif;font-weight:800}
@media(max-width:420px){.skill{grid-template-columns:96px 1fr 38px;font-size:12.5px}}
/* ---------- SCORE PICKER ---------- */
.crit{border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:12px;background:#fff}
.crit-hd{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.crit-hd .ic{width:36px;height:36px;border-radius:11px;background:var(--blue-soft);display:grid;place-items:center;font-size:17px}
.crit-hd b{font-size:14.5px}
.crit-hd span{font-size:11.5px;color:var(--muted);display:block;font-weight:500}
.crit-hd .pick{margin-left:auto;font-family:'Inter';font-size:22px;font-weight:800;color:var(--blue)}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
@media(max-width:560px){.scale{grid-template-columns:repeat(5,1fr);gap:7px}}
.sbtn{aspect-ratio:1/1;min-height:42px;border:1.5px solid var(--line);border-radius:12px;background:#FAFBFE;font-weight:800;font-family:'Inter';font-size:15px;color:#475569;cursor:pointer;transition:.15s}
.sbtn:hover{border-color:#A9C6F7;background:#fff}
.sbtn.on{background:linear-gradient(135deg,var(--blue2),#1D4ED8);border-color:transparent;color:#fff;transform:scale(1.06);box-shadow:0 7px 16px rgba(37,99,235,.32)}
/* ---------- MISC ---------- */
.progress-wrap{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;color:var(--muted)}
.rankrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1px solid var(--line);background:#fff;margin-bottom:9px;cursor:pointer;transition:.18s}
.rankrow:hover{transform:translateY(-1px);box-shadow:var(--sh-sm)}
.rankrow .pos{width:32px;text-align:center;font-weight:800;font-family:'Inter';font-size:16px;color:var(--muted)}
.rankrow.top{background:linear-gradient(135deg,#fff,#F7FAFF);border-color:#D7E5FF}
.rankrow .sc{margin-left:auto;font-family:'Inter';font-size:20px;font-weight:800;letter-spacing:-.6px}
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty .em{font-size:40px;margin-bottom:8px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:3px}
.sk{background:linear-gradient(90deg,#EDF1F7 25%,#F7F9FC 37%,#EDF1F7 63%);background-size:400% 100%;animation:sh 1.3s infinite;border-radius:12px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:200;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:400px;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;font-size:13.5px;font-weight:600;box-shadow:0 12px 30px rgba(11,27,58,.3);display:flex;gap:9px;align-items:center;animation:tin .25s ease}
.toast.ok{background:linear-gradient(135deg,#10B981,#059669)}
.toast.err{background:linear-gradient(135deg,#EF4444,#DC2626)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#modalRoot{position:fixed;inset:0;z-index:300;display:none;align-items:flex-end;justify-content:center;background:rgba(11,27,58,.5);backdrop-filter:blur(3px);padding:0}
#modalRoot.on{display:flex}
.modal{background:#fff;width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:20px;animation:mu .28s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
@media(min-width:620px){#modalRoot{align-items:center}.modal{border-radius:22px}}
@keyframes mu{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.fade{animation:fi .3s ease}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sep{height:1px;background:var(--line);margin:14px 0}
.muted{color:var(--muted)}.tiny{font-size:11.5px}.center{text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:#F5F8FD;border:1px solid var(--line);border-radius:11px;padding:7px 11px;font-size:12.5px;font-weight:600;color:#334155}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.quote{background:#F7F9FC;border-left:3px solid var(--blue2);border-radius:0 12px 12px 0;padding:9px 12px;font-size:13px;margin-bottom:8px;color:#334155}
canvas{max-width:100%}
</style>
</head>
<body>
<div id="demoBanner" class="demo-banner" hidden>⚠ DEMO MODE — ข้อมูลตัวอย่างสำหรับดู UI เท่านั้น ไม่ใช่ข้อมูลจริง</div>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">🏸</div>
      <div><b>Badminton Rating</b><small>เล่นด้วยกัน พัฒนาไปด้วยกัน</small></div>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot" id="sideMe"></div>
  </aside>
  <main>
    <header class="topbar">
      <div><h1 id="topTitle">Home</h1><div class="sub" id="topSub"></div></div>
      <div class="right" id="topRight"></div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>
<nav class="bottomnav" id="bottomNav"></nav>
<div id="toasts"></div>
<div id="modalRoot"><div class="modal" id="modalBody"></div></div>

<script>
/* ==========================================================
   0) CONFIG  — ใส่ค่าจาก Supabase ตรงนี้
   ========================================================== */
const CONFIG = {
  SUPABASE_URL:      'https://gzdcwxtybtdbdnbmykrg.supabase.co',       // เช่น https://abcdefgh.supabase.co
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6ZGN3eHR5YnRkYmRuYm15a3JnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MDE0OTAsImV4cCI6MjEwNjQ3NzQ5MH0.9pyeyOgQTd16ZUMRIBu68eE0ASvg6ujJLGP1jD_m-Ak'   // anon / publishable key เท่านั้น
};
const DEMO = !/^https:\/\/[a-z0-9-]+\.supabase\.co/i.test(CONFIG.SUPABASE_URL) || (CONFIG.SUPABASE_ANON_KEY||'').length < 40;
const sb = DEMO ? null : window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
if (DEMO) document.getElementById('demoBanner').hidden = false;

/* ==========================================================
   1) UTILITIES
   ========================================================== */
const $  = s => document.querySelector(s);
const VIEW = $('#view');
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'x'+Math.random().toString(36).slice(2)+Date.now());
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const num = v => Number(v ?? 0);
const f1 = v => (Math.round(num(v)*10)/10).toFixed(1);
const f2 = v => (Math.round(num(v)*100)/100).toFixed(2);

const CRITERIA = [
  {k:'smash',      em:'🏸', t:'Smash',      d:'ลูกตบ'},
  {k:'accuracy',   em:'🎯', t:'Accuracy',   d:'ความแม่นยำ'},
  {k:'footwork',   em:'🦶', t:'Footwork',   d:'การเคลื่อนที่'},
  {k:'defense',    em:'🛡️', t:'Defense',    d:'เกมรับ'},
  {k:'game_sense', em:'🧠', t:'Game Sense', d:'การอ่านเกม'}
];
const LEVELS = [
  {min:9.5, n:'Elite',        c:'b-elite'},
  {min:8.0, n:'Expert',       c:'b-expert'},
  {min:6.5, n:'Advanced',     c:'b-advanced'},
  {min:5.0, n:'Intermediate', c:'b-intermediate'},
  {min:3.0, n:'Novice',       c:'b-novice'},
  {min:0,   n:'Beginner',     c:'b-beginner'}
];
const levelOf = s => LEVELS.find(l => num(s) >= l.min) || LEVELS[LEVELS.length-1];
const levelBadge = s => { const l = levelOf(s); return `<span class="badge ${l.c}">${l.n}</span>`; };

const AV_COLORS = ['#2563EB','#10B981','#F59E0B','#8B5CF6','#EC4899','#06B6D4','#EF4444','#14B8A6','#6366F1','#F97316'];
function avColor(name){ let h=0; for(const ch of String(name||'?')) h=(h*31+ch.charCodeAt(0))>>>0; return AV_COLORS[h%AV_COLORS.length]; }
function initials(name){ const p=String(name||'?').trim().split(/\s+/); return ((p[0]?.[0]||'?')+(p[1]?.[0]||'')).toUpperCase(); }
const avatar = (name, cls='') => `<div class="av ${cls}" style="background:${avColor(name)}">${esc(initials(name))}</div>`;

const MONTH_TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function fmtDate(d){ if(!d) return '-'; const x=new Date(d+'T00:00:00'); if(isNaN(x)) return d;
  return `${x.getDate()} ${MONTH_TH[x.getMonth()]} ${x.getFullYear()+543}`; }
function fmtDateShort(d){ if(!d) return '-'; const x=new Date(d+'T00:00:00'); if(isNaN(x)) return d;
  return `${x.getDate()}/${x.getMonth()+1}`; }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }

function toast(msg, type='', ms=2600){
  const el=document.createElement('div'); el.className='toast '+type;
  const ic = type==='ok'?'✓':type==='err'?'!':'•';
  el.innerHTML=`<b>${ic}</b><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el); setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(10px)';setTimeout(()=>el.remove(),250)},ms);
}
function openModal(html){ $('#modalBody').innerHTML=html; $('#modalRoot').classList.add('on'); icons(); }
function closeModal(){ $('#modalRoot').classList.remove('on'); }
$('#modalRoot').addEventListener('click', e=>{ if(e.target.id==='modalRoot') closeModal(); });
function icons(){ try{ window.lucide && lucide.createIcons(); }catch(e){} }

    SELF_RATING_FORBIDDEN:'ห้ามให้คะแนนตัวเอง', NOT_HOST:'เฉพาะ Host เท่านั้นที่ทำรายการนี้ได้',
    NEED_2_PLAYERS:'ต้องมีผู้เล่นอย่างน้อย 2 คน', CANNOT_REMOVE_HOST:'ไม่สามารถลบ Host ได้',

const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k);}catch(e){} }
};
function myToken(){ let t=LS.get('br_token'); if(!t){ t='pt_'+uid().replace(/-/g,''); LS.set('br_token',t);} return t; }

/* ==========================================================
   2) DEMO BACKEND (localStorage) — mirror ของ RPC ทั้งหมด
   ========================================================== */
const DemoDB = {
  key:'br_demo_db_v1',
  load(){ let d=LS.get(this.key,null); if(!d){ d=this.seed(); LS.set(this.key,d);} return d; },
  save(d){ LS.set(this.key,d); window.dispatchEvent(new CustomEvent('br-change')); },
  seed(){
    const rnd=(s=>()=>((s=(s*1664525+1013904223)%4294967296)/4294967296))(20261002);
    const base=[['Aof',8.8,.05],['Nopchai',8.1,.07],['Bank',7.9,.06],['Tom',7.6,.04],
                ['Golf',7.2,.08],['Mint',6.8,.05],['Pete',6.1,.09]];
    const players=base.map(([n])=>({id:uid(),name:n,avatar_url:null,created_at:new Date().toISOString()}));
    const sessions=[],session_players=[],ratings=[];
    const venues=['สนาม A','สนาม B','Smash Arena','Victor Court'];
    for(let w=11;w>=0;w--){
      const dt=new Date(); dt.setDate(dt.getDate()-w*7);
      const sid=uid();
      sessions.push({id:sid,session_code:String(100000+Math.floor(rnd()*899999)),
        name:(w%2?'Friday Badminton':'Weekend Smash'),date:dt.toISOString().slice(0,10),
        time:w%2?'19:00':'17:30',venue:venues[w%4],duration:'2 ชั่วโมง',status:'completed',
        submitted_count:0,created_at:dt.toISOString(),updated_at:dt.toISOString()});
      const n=5+Math.floor(rnd()*2.9);
      const joined=players.slice(0,n);
      joined.forEach((p,i)=>session_players.push({id:uid(),session_id:sid,player_id:p.id,
        participant_token:null,is_host:i===0,joined_at:dt.toISOString()}));
      joined.forEach(rater=>joined.forEach(target=>{
        if(rater.id===target.id) return;
        const b=base.find(x=>x[0]===target.name);
        const sc={}; let sum=0;
        CRITERIA.forEach(c=>{
          let v=b[1]+b[2]*(11-w)+(rnd()*1.8-0.9);
          v=Math.max(1,Math.min(10,Math.round(v))); sc[c.k]=v; sum+=v;
        });
        ratings.push({id:uid(),session_id:sid,rater_player_id:rater.id,rated_player_id:target.id,
          ...sc,overall:Math.round(sum/5*100)/100,
          comment: rnd()>.86 ? ['ลูกตบดีขึ้นมาก แต่ Footwork ยังช้า','เกมรับเหนียวมาก','อ่านเกมเก่ง วางลูกดี','วันนี้ฟอร์มดีสุด ๆ'][Math.floor(rnd()*4)] : null,
          created_at:dt.toISOString()});
      }));
      sessions[sessions.length-1].submitted_count=joined.length;
    }
    return {players,sessions,session_players,ratings};
  }
};
const DemoAPI = {
  async players(){ return DemoDB.load().players.slice().sort((a,b)=>a.name.localeCompare(b.name)); },
  async createSession(p){
    const d=DemoDB.load(); const code=String(100000+Math.floor(Math.random()*899999));
    const s={id:uid(),session_code:code,name:p.name,date:p.date,time:p.time,venue:p.venue,
      duration:p.duration,status:'lobby',submitted_count:0,created_at:new Date().toISOString(),updated_at:new Date().toISOString()};
    d.sessions.push(s);
    let pl=d.players.find(x=>x.name.toLowerCase()===p.hostName.trim().toLowerCase());
    if(!pl){ pl={id:uid(),name:p.hostName.trim(),avatar_url:null,created_at:new Date().toISOString()}; d.players.push(pl); }
    d.session_players.push({id:uid(),session_id:s.id,player_id:pl.id,participant_token:myToken(),is_host:true,joined_at:new Date().toISOString()});
    DemoDB.save(d);
    return {session_id:s.id,session_code:code,player_id:pl.id,player_name:pl.name,is_host:true};
  },
  async joinSession(code,name){
    const d=DemoDB.load(); const s=d.sessions.find(x=>x.session_code===String(code).trim());
    if(!s) throw new Error('SESSION_NOT_FOUND'); if(s.status==='closed') throw new Error('SESSION_CLOSED');
    let pl=d.players.find(x=>x.name.toLowerCase()===name.trim().toLowerCase());
    if(!pl){ pl={id:uid(),name:name.trim(),avatar_url:null,created_at:new Date().toISOString()}; d.players.push(pl); }
    let sp=d.session_players.find(x=>x.session_id===s.id&&x.player_id===pl.id);
    if(sp) sp.participant_token=myToken();
    else d.session_players.push({id:uid(),session_id:s.id,player_id:pl.id,participant_token:myToken(),is_host:false,joined_at:new Date().toISOString()});
    DemoDB.save(d);
    return {session_id:s.id,session_code:s.session_code,player_id:pl.id,is_host:!!sp?.is_host,status:s.status};
  },
  async sessionByCode(code){ return DemoDB.load().sessions.find(x=>x.session_code===String(code).trim())||null; },
  async roster(sid){
    const d=DemoDB.load();
    return d.session_players.filter(x=>x.session_id===sid).map(sp=>{
      const p=d.players.find(y=>y.id===sp.player_id)||{};
      return {row_id:sp.id,player_id:sp.player_id,name:p.name,avatar_url:p.avatar_url,is_host:sp.is_host,
        joined_at:sp.joined_at,has_submitted:d.ratings.some(r=>r.session_id===sid&&r.rater_player_id===sp.player_id)};
    }).sort((a,b)=>new Date(a.joined_at)-new Date(b.joined_at));
  },
  async addPlayer(sid,_t,name){
    const d=DemoDB.load();
    let pl=d.players.find(x=>x.name.toLowerCase()===name.trim().toLowerCase());
    if(!pl){ pl={id:uid(),name:name.trim(),avatar_url:null,created_at:new Date().toISOString()}; d.players.push(pl); }
    if(!d.session_players.some(x=>x.session_id===sid&&x.player_id===pl.id))
      d.session_players.push({id:uid(),session_id:sid,player_id:pl.id,participant_token:null,is_host:false,joined_at:new Date().toISOString()});
    DemoDB.save(d); return pl.id;
  },
  async removePlayer(sid,_t,pid){
    const d=DemoDB.load();
    if(d.session_players.some(x=>x.session_id===sid&&x.player_id===pid&&x.is_host)) throw new Error('CANNOT_REMOVE_HOST');
    d.session_players=d.session_players.filter(x=>!(x.session_id===sid&&x.player_id===pid)); DemoDB.save(d);
  },
  async updateSession(sid,_t,p){
    const d=DemoDB.load(); const s=d.sessions.find(x=>x.id===sid); Object.assign(s,p); s.updated_at=new Date().toISOString(); DemoDB.save(d);
  },
  async setStatus(sid,_t,st){
    const d=DemoDB.load(); const s=d.sessions.find(x=>x.id===sid);
    const n=d.session_players.filter(x=>x.session_id===sid).length;
    if(st==='rating'&&n<2) throw new Error('NEED_2_PLAYERS');
    s.status=st; s.updated_at=new Date().toISOString(); DemoDB.save(d);
  },
  async submit(sid,_t,items,raterId){
    const d=DemoDB.load(); const s=d.sessions.find(x=>x.id===sid);
    if(s.status!=='rating') throw new Error('SESSION_NOT_RATING');
    if(d.ratings.some(r=>r.session_id===sid&&r.rater_player_id===raterId)) throw new Error('ALREADY_SUBMITTED');
    const need=d.session_players.filter(x=>x.session_id===sid).length-1;
    if(items.length!==need) throw new Error('INCOMPLETE_RATINGS');
    items.forEach(it=>{
      if(it.rated_player_id===raterId) throw new Error('SELF_RATING_FORBIDDEN');
      const sum=CRITERIA.reduce((a,c)=>a+Number(it[c.k]),0);
      d.ratings.push({id:uid(),session_id:sid,rater_player_id:raterId,rated_player_id:it.rated_player_id,
        smash:it.smash,accuracy:it.accuracy,footwork:it.footwork,defense:it.defense,game_sense:it.game_sense,
        overall:Math.round(sum/5*100)/100,comment:it.comment||null,created_at:new Date().toISOString()});
    });
    const total=d.session_players.filter(x=>x.session_id===sid).length;
    const done=new Set(d.ratings.filter(r=>r.session_id===sid).map(r=>r.rater_player_id)).size;
    s.submitted_count=done; if(done>=total) s.status='completed'; s.updated_at=new Date().toISOString();
    DemoDB.save(d); return {completed:done,total};
  },
  async results(sid){
    const d=DemoDB.load(); const by={};
    d.ratings.filter(r=>r.session_id===sid).forEach(r=>{
      const k=r.rated_player_id; by[k]=by[k]||{n:0,voters:new Set(),sum:{}};
      by[k].n++; by[k].voters.add(r.rater_player_id);
      CRITERIA.forEach(c=>by[k].sum[c.k]=(by[k].sum[c.k]||0)+r[c.k]);
      by[k].sum.overall=(by[k].sum.overall||0)+Number(r.overall);
    });
    return Object.entries(by).map(([pid,v])=>{
      const p=d.players.find(x=>x.id===pid)||{};
      const o={player_id:pid,player_name:p.name,voters:v.voters.size};
      CRITERIA.forEach(c=>o[c.k]=v.sum[c.k]/v.n);
      o.overall=v.sum.overall/v.n; return o;
    }).sort((a,b)=>b.overall-a.overall);
  },
  async comments(sid){ return DemoDB.load().ratings.filter(r=>r.session_id===sid&&r.comment)
      .map(r=>({rated_player_id:r.rated_player_id,comment:r.comment})); },
  async allScores(){
    const d=DemoDB.load(); const out=[];
    d.sessions.filter(s=>['completed','closed'].includes(s.status)).forEach(s=>{
      const by={};
      d.ratings.filter(r=>r.session_id===s.id).forEach(r=>{
        by[r.rated_player_id]=by[r.rated_player_id]||{n:0,sum:{}};
        const b=by[r.rated_player_id]; b.n++;
        CRITERIA.forEach(c=>b.sum[c.k]=(b.sum[c.k]||0)+r[c.k]);
        b.sum.overall=(b.sum.overall||0)+Number(r.overall);
      });
      Object.entries(by).forEach(([pid,v])=>{
        const p=d.players.find(x=>x.id===pid)||{};
        const row={session_id:s.id,session_code:s.session_code,session_name:s.name,session_date:s.date,
          venue:s.venue,player_id:pid,player_name:p.name};
        CRITERIA.forEach(c=>row[c.k]=v.sum[c.k]/v.n); row.overall=v.sum.overall/v.n; out.push(row);
      });
    });
    return out.sort((a,b)=>new Date(a.session_date)-new Date(b.session_date));
  },
  async sessions(){ return DemoDB.load().sessions.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)); },
  async sessionPlayerCount(sid){ return DemoDB.load().session_players.filter(x=>x.session_id===sid).length; },
  subscribe(_sid,cb){ const h=()=>cb(); window.addEventListener('br-change',h); window.addEventListener('storage',h);
    return ()=>{window.removeEventListener('br-change',h);window.removeEventListener('storage',h);} }
};

const rpc = async (fn, args) => { const {data,error}=await sb.rpc(fn,args); if(error) throw error; return data; };
const SupaAPI = {
  async players(){ const {data,error}=await sb.from('players').select('*').order('name'); if(error) throw error; return data||[]; },
  async createSession(p){ return rpc('create_session',{p_name:p.name,p_date:p.date,p_time:p.time,
      p_venue:p.venue,p_duration:p.duration,p_host_name:p.hostName,p_token:myToken()}); },
  async joinSession(code,name){ return rpc('join_session',{p_code:String(code).trim(),p_name:name,p_token:myToken()}); },
  async sessionByCode(code){ const {data,error}=await sb.from('sessions').select('*').eq('session_code',String(code).trim()).maybeSingle();
      if(error) throw error; return data; },
  async roster(sid){ return (await rpc('session_roster',{p_session:sid}))||[]; },
  async addPlayer(sid,t,name){ return rpc('host_add_player',{p_session:sid,p_token:t,p_name:name}); },
  async removePlayer(sid,t,pid){ return rpc('host_remove_player',{p_session:sid,p_token:t,p_player:pid}); },
  async updateSession(sid,t,p){ return rpc('host_update_session',{p_session:sid,p_token:t,p_name:p.name,
      p_date:p.date,p_time:p.time,p_venue:p.venue,p_duration:p.duration}); },
  async setStatus(sid,t,st){ return rpc('set_session_status',{p_session:sid,p_token:t,p_status:st}); },
  async submit(sid,t,items){ return rpc('submit_ratings',{p_session:sid,p_token:t,p_items:items}); },
  async results(sid){ return (await rpc('session_results',{p_session:sid,p_token:myToken()}))||[]; },
  async comments(sid){ return (await rpc('session_comments',{p_session:sid}))||[]; },
  async allScores(){ return (await rpc('player_session_scores'))||[]; },
  async sessions(){ const {data,error}=await sb.from('sessions').select('*').order('date',{ascending:false}).limit(200);
      if(error) throw error; return data||[]; },
  subscribe(sid,cb){
    const ch=sb.channel('br-'+sid)
      .on('postgres_changes',{event:'*',schema:'public',table:'sessions',filter:'id=eq.'+sid}, ()=>cb())
      .subscribe();
    return ()=>{ try{ sb.removeChannel(ch);}catch(e){} };
  }
};
const API = DEMO ? DemoAPI : SupaAPI;

function aggregateByPlayer(rows){
  const by={};
  rows.forEach(r=>{
    const k=r.player_id;
    by[k]=by[k]||{player_id:k,player_name:r.player_name,sessions:0,sum:{overall:0},hist:[]};
    const b=by[k]; b.sessions++;
    CRITERIA.forEach(c=>b.sum[c.k]=(b.sum[c.k]||0)+num(r[c.k]));
    b.sum.overall+=num(r.overall);
    b.hist.push({date:r.session_date,code:r.session_code,name:r.session_name,overall:num(r.overall)});
  });
  return Object.values(by).map(b=>{
    const o={player_id:b.player_id,player_name:b.player_name,sessions:b.sessions,
      overall:b.sum.overall/b.sessions, hist:b.hist.sort((x,y)=>new Date(x.date)-new Date(y.date))};
    CRITERIA.forEach(c=>o[c.k]=b.sum[c.k]/b.sessions);
    return o;
  }).sort((a,b)=>b.overall-a.overall);
}
const medal = i => ['🥇','🥈','🥉'][i] || `${i+1}`;
function skillBars(o){
  return CRITERIA.map(c=>`<div class="skill"><span>${c.em} ${c.t}</span>
    <div class="bar"><i style="width:${Math.max(4,num(o[c.k])*10)}%"></i></div><b>${f1(o[c.k])}</b></div>`).join('');
}
function lineChart(canvasId, labels, data, label='Overall'){
  const ctx=document.getElementById(canvasId); if(!ctx) return;
  const g=ctx.getContext('2d').createLinearGradient(0,0,0,210);
  g.addColorStop(0,'rgba(37,99,235,.28)'); g.addColorStop(1,'rgba(37,99,235,0)');
  charts.push(new Chart(ctx,{type:'line',data:{labels,datasets:[{label,data,borderColor:'#2563EB',
    backgroundColor:g,fill:true,tension:.38,borderWidth:3,pointRadius:4,pointBackgroundColor:'#fff',
    pointBorderColor:'#2563EB',pointBorderWidth:2.5}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{y:{suggestedMin:Math.max(0,Math.min(...data)-1),suggestedMax:10,ticks:{stepSize:1,color:'#94A3B8'},grid:{color:'#EEF2F8'}},
              x:{ticks:{color:'#94A3B8',maxRotation:0,autoSkipPadding:14},grid:{display:false}}}}}));
}
function radarChart(canvasId,o){
  const ctx=document.getElementById(canvasId); if(!ctx) return;
  charts.push(new Chart(ctx,{type:'radar',data:{labels:CRITERIA.map(c=>c.t),
    datasets:[{data:CRITERIA.map(c=>num(o[c.k])),backgroundColor:'rgba(16,185,129,.2)',borderColor:'#10B981',
      borderWidth:2.5,pointBackgroundColor:'#10B981',pointRadius:3.5}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{r:{min:0,max:10,ticks:{stepSize:2,backdropColor:'transparent',color:'#94A3B8',font:{size:9}},
        grid:{color:'#E6EAF2'},angleLines:{color:'#E6EAF2'},pointLabels:{font:{size:11,weight:'600'},color:'#475569'}}}}}));
}

/* ---------- JOIN ---------- */
async function PageJoin(){
  setTop('เข้าร่วม Session','ใส่ Code 6 หลักจากเพื่อน');
  VIEW.innerHTML=`<div class="card fade">
    <div class="card-hd"><i data-lucide="key-round" style="color:var(--blue)"></i><h3>Session Code</h3></div>
    <input class="code-input" id="f_code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off">
    <div class="btn-row"><button class="btn btn-primary btn-lg" id="btnCheck"><i data-lucide="search"></i> ตรวจสอบ Code</button>
      <button class="btn btn-ghost" onclick="go('#/home')">ยกเลิก</button></div>
    <div id="joinStep"></div></div>`;
  icons();
  const inp=$('#f_code');
  inp.addEventListener('input',()=>{ inp.value=inp.value.replace(/\D/g,'').slice(0,6); if(inp.value.length===6) $('#btnCheck').click(); });
  inp.focus();
  $('#btnCheck').onclick=async e=>{
    const code=inp.value.trim(); if(code.length!==6) return toast('กรุณาใส่ Code 6 หลัก','err');
    const b=e.currentTarget; b.disabled=true; b.innerHTML='กำลังตรวจสอบ...';
    try{
      const s=await API.sessionByCode(code);
      if(!s) throw new Error('SESSION_NOT_FOUND');
      if(s.status==='closed') throw new Error('SESSION_CLOSED');
      const [players,roster]=await Promise.all([API.players(),API.roster(s.id)]);
      renderJoinStep(s,players,roster);
    }catch(err){ toast(errText(err),'err'); }
    b.disabled=false; b.innerHTML='ตรวจสอบ Code'; icons();
  };
}
function renderJoinStep(s,players,roster){
  const inRoster=new Set(roster.map(r=>r.player_id));
  const list=[...roster.map(r=>({id:r.player_id,name:r.name,joined:true})),
              ...players.filter(p=>!inRoster.has(p.id)).map(p=>({id:p.id,name:p.name,joined:false}))];
  $('#joinStep').innerHTML=`<div class="sep"></div>
    <div class="chips" style="margin-bottom:12px">
      <span class="chip"><i data-lucide="calendar" style="width:14px"></i>${esc(s.name)}</span>
      <span class="chip">📍 ${esc(s.venue||'-')}</span>
      <span class="chip">🗓 ${fmtDate(s.date)} ${esc(s.time||'')}</span></div>
    <label class="tiny muted" style="font-weight:700">เลือกชื่อผู้เล่นของคุณ</label>
    <div class="plist" style="margin:8px 0 12px">
      ${list.map(p=>`<div class="prow j-pick" data-n="${esc(p.name)}">${avatar(p.name,'sm')}
        <div class="nm">${esc(p.name)}</div><div class="tail">${p.joined?'<span class="badge b-live">อยู่ใน Session</span>':''}
        <i data-lucide="chevron-right"></i></div></div>`).join('')}
    </div>
    <div class="field"><label>หรือเพิ่มชื่อใหม่</label>
      <div style="display:flex;gap:8px"><input class="input" id="f_newname" placeholder="ชื่อของคุณ">
      <button class="btn btn-navy" id="btnNew"><i data-lucide="user-plus"></i></button></div></div>`;
  icons();
  const join = async name => {
    if(!name) return toast('กรุณากรอกชื่อ','err');
    try{
      toast('กำลังเข้าร่วม Session...');
      const r=await API.joinSession(s.session_code,name);
      setIdent(s.session_code,{session_id:r.session_id,player_id:r.player_id,player_name:name,is_host:!!r.is_host});
      setMe({id:r.player_id,name}); setActive(s.session_code);
      toast('เข้าร่วมเรียบร้อย ✓','ok'); go('#/lobby/'+s.session_code);
    }catch(err){ toast(errText(err),'err'); }
  };
  $('#joinStep').querySelectorAll('.j-pick').forEach(el=>el.onclick=()=>join(el.dataset.n));
  $('#btnNew').onclick=()=>join($('#f_newname').value.trim());
}

      $('#bStart').onclick=async e=>{ const b=e.currentTarget; b.disabled=true; b.innerHTML='กำลังเริ่ม...';
        try{ await API.setStatus(cur.id,myToken(),'rating'); toast('เริ่มการให้คะแนนแล้ว ✓','ok'); go('#/rate/'+code); }
        catch(err){ toast(errText(err),'err'); b.disabled=false; b.innerHTML='เริ่มการให้คะแนน'; icons(); } };
      $('#bClose').onclick=async()=>{
        openModal(`<h3 style="margin:0 0 8px">ปิด Session?</h3><p class="tiny muted">ปิดแล้วจะไม่สามารถให้คะแนนเพิ่มได้</p>
          <div class="btn-row two"><button class="btn btn-danger" id="m_ok">ปิด Session</button>
          <button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button></div>`);
        $('#m_ok').onclick=async()=>{ try{ await API.setStatus(cur.id,myToken(),'closed'); closeModal();
          setActive(null); toast('ปิด Session แล้ว','ok'); go('#/result/'+code); }catch(e){ toast(errText(e),'err'); } };
      };
    }
  };
  await render();
  unsub = API.subscribe(s.id, ()=>render());
}
async function hasSubmitted(sid, playerId){
  const r=await API.roster(sid); return !!r.find(x=>x.player_id===playerId)?.has_submitted;
}

/* ---------- RATING ---------- */
async function PageRate(code){
  const ident=getIdent(code);
  const s=await API.sessionByCode(code);
  if(!s) return go('#/join');
  if(!ident) return go('#/join');
  if(s.status==='lobby') return go('#/lobby/'+code);
  if(s.status==='completed'||s.status==='closed') return go('#/result/'+code);

  let roster=await API.roster(s.id);
  const meRow=roster.find(r=>r.player_id===ident.player_id);
  if(meRow?.has_submitted) return renderWaiting();

  /* 6.1 ยืนยันว่าใครกำลังให้คะแนน */
  let confirmed = LS.get('br_confirm_'+code,false);
  if(!confirmed) return renderWhoAmI();

  function renderWhoAmI(){
    setTop('ใครกำลังให้คะแนน?','เลือกชื่อของคุณเพื่อเริ่ม');
    VIEW.innerHTML=`<div class="card fade"><div class="card-hd"><i data-lucide="user-check" style="color:var(--blue)"></i>
      <h3>ใครกำลังให้คะแนน?</h3></div>
      <p class="tiny muted" style="margin-top:-6px">ระบบจะซ่อนชื่อของคุณออกจากรายการให้คะแนนโดยอัตโนมัติ</p>
      <div class="plist">${roster.map(r=>`<div class="prow who ${r.has_submitted?'':''}" data-id="${r.player_id}" data-n="${esc(r.name)}">
        ${avatar(r.name,'sm')}<div><div class="nm">${esc(r.name)}</div>
        <div class="meta">${r.has_submitted?'ส่งคะแนนแล้ว':'ยังไม่ได้ให้คะแนน'}</div></div>
        <div class="tail">${r.player_id===ident.player_id?'<span class="badge b-lobby">ที่บันทึกไว้</span>':''}
        <i data-lucide="chevron-right"></i></div></div>`).join('')}</div></div>`;
    icons();
    VIEW.querySelectorAll('.who').forEach(el=>el.onclick=async()=>{
      const pid=el.dataset.id, nm=el.dataset.n;
      if(pid!==ident.player_id){
        try{ const r=await API.joinSession(code,nm); ident.player_id=r.player_id; ident.player_name=nm;
          setIdent(code,ident); setMe({id:r.player_id,name:nm}); }catch(e){ return toast(errText(e),'err'); }
      }
      roster=await API.roster(s.id);
      if(roster.find(r=>r.player_id===ident.player_id)?.has_submitted) return renderWaiting();
      LS.set('br_confirm_'+code,true); startRating();
    });
  }

  function startRating(){
    const targets=roster.filter(r=>r.player_id!==ident.player_id);
    if(!targets.length){ return VIEW.innerHTML=`<div class="card"><div class="empty"><div class="em">🤔</div>
      <b>ยังไม่มีเพื่อนให้คะแนน</b><div class="tiny">ต้องมีผู้เล่นอย่างน้อย 2 คน</div></div></div>`; }
    const st={idx:0, data:{}};
    targets.forEach(t=>st.data[t.player_id]={comment:''});

    const render=()=>{
      const t=targets[st.idx], d=st.data[t.player_id];
      const done=CRITERIA.every(c=>d[c.k]);
      setTop('ให้คะแนนเพื่อน',`${st.idx+1} / ${targets.length} · โดย ${ident.player_name}`);
      VIEW.innerHTML=`
        <div class="card fade" style="padding:16px">
          <div class="progress-wrap"><div class="bar" style="flex:1"><i style="width:${(st.idx)/targets.length*100}%"></i></div>
            <span>${st.idx+1}/${targets.length}</span></div>
          <div style="display:flex;align-items:center;gap:13px;margin-top:14px">
            ${avatar(t.name,'lg')}
            <div><div style="font-size:19px;font-weight:800;letter-spacing:-.3px">${esc(t.name)}</div>
              <div class="tiny muted">ให้คะแนนตามฝีมือวันนี้ 1–10</div></div>
            <div style="margin-left:auto;text-align:right">
              <div class="tiny muted">คะแนนรวม</div>
              <div style="font-family:Inter;font-size:25px;font-weight:800;color:${done?'var(--green)':'#CBD5E1'}">
                ${done?f1(CRITERIA.reduce((a,c)=>a+d[c.k],0)/5):'—'}</div></div>
          </div>
        </div>
        ${CRITERIA.map(c=>`<div class="crit fade">
          <div class="crit-hd"><div class="ic">${c.em}</div>
            <div><b>${c.t}</b><span>${c.d}</span></div>
            <div class="pick" id="pk_${c.k}">${d[c.k]||'–'}</div></div>
          <div class="scale" data-k="${c.k}">
            ${Array.from({length:10},(_,i)=>`<button class="sbtn ${d[c.k]===i+1?'on':''}" data-v="${i+1}">${i+1}</button>`).join('')}
          </div></div>`).join('')}
        <div class="card fade"><div class="card-hd"><i data-lucide="message-square" style="color:var(--blue)"></i>
          <h3>Comment <span class="tiny muted" style="font-weight:500">(ไม่บังคับ)</span></h3></div>
          <textarea class="input" id="cmt" rows="3" placeholder="เช่น ลูกตบดีขึ้นมาก แต่ Footwork ยังช้า">${esc(d.comment||'')}</textarea></div>
        <div class="btn-row two">
          ${st.idx>0?`<button class="btn btn-ghost" id="bPrev"><i data-lucide="chevron-left"></i> ก่อนหน้า</button>`:'<span></span>'}
          <button class="btn ${st.idx===targets.length-1?'btn-green':'btn-primary'}" id="bNext" ${done?'':'disabled'}>
            ${st.idx===targets.length-1?'<i data-lucide="send"></i> ส่งคะแนนทั้งหมด':'ถัดไป <i data-lucide="chevron-right"></i>'}</button>
        </div>
        <p class="tiny muted center" style="margin-top:10px">🔒 คะแนนของเพื่อนคนอื่นจะถูกซ่อนจนกว่าคุณจะส่งคะแนน</p>`;
      icons();
      VIEW.querySelectorAll('.scale').forEach(sc=>sc.querySelectorAll('.sbtn').forEach(b=>b.onclick=()=>{
        d[sc.dataset.k]=Number(b.dataset.v);
        sc.querySelectorAll('.sbtn').forEach(x=>x.classList.remove('on')); b.classList.add('on');
        $('#pk_'+sc.dataset.k).textContent=b.dataset.v;
        const ok=CRITERIA.every(c=>d[c.k]); $('#bNext').disabled=!ok;
        if(ok){ const el=VIEW.querySelector('.card .pick'); }
        const sum=CRITERIA.reduce((a,c)=>a+(d[c.k]||0),0);
        const box=VIEW.querySelector('.card [style*="font-family:Inter"]');
        if(ok&&box){ box.textContent=f1(sum/5); box.style.color='var(--green)'; }
      }));
      const ta=$('#cmt'); ta.oninput=()=>d.comment=ta.value;
      if($('#bPrev')) $('#bPrev').onclick=()=>{ st.idx--; render(); };
      $('#bNext').onclick=async()=>{
        if(st.idx<targets.length-1){ st.idx++; render(); window.scrollTo(0,0); return; }
        const items=targets.map(t=>({rated_player_id:t.player_id,...CRITERIA.reduce((a,c)=>(a[c.k]=st.data[t.player_id][c.k],a),{}),
          comment:st.data[t.player_id].comment||null}));
        const b=$('#bNext'); b.disabled=true; b.innerHTML='กำลังบันทึกคะแนน...';
        try{
          await API.submit(s.id,myToken(),items,ident.player_id);
          LS.del('br_confirm_'+code);
          toast('บันทึกคะแนนเรียบร้อย ✓','ok');
          renderWaiting();
        }catch(err){ toast(errText(err),'err'); b.disabled=false; b.innerHTML='ส่งคะแนนทั้งหมด'; icons(); }
      };
    };
    render();
  }

  async function renderWaiting(){
    cleanup();
    const draw=async()=>{
      const cur=await API.sessionByCode(code);
      if(cur.status==='completed'||cur.status==='closed'){ cleanup(); return go('#/result/'+code); }
      const r=await API.roster(cur.id);
      const done=r.filter(x=>x.has_submitted).length, total=r.length;
      const isHost=r.some(x=>x.player_id===ident.player_id&&x.is_host);
      setTop('ส่งคะแนนแล้ว','รอเพื่อนให้คะแนนครบ');
      let liveHtml='';
      try{
        const res=await API.results(cur.id);
        liveHtml=`<div class="card fade"><div class="card-hd"><i data-lucide="bar-chart-3" style="color:var(--green)"></i>
          <h3>คะแนนปัจจุบัน (ยังไม่ครบทุกคน)</h3></div>
          ${res.map((x,i)=>`<div class="rankrow"><div class="pos">${medal(i)}</div>${avatar(x.player_name,'sm')}
            <div><div class="nm" style="font-weight:700">${esc(x.player_name)}</div>
            <div class="tiny muted">${x.voters} คนให้คะแนน</div></div><div class="sc">${f1(x.overall)}</div></div>`).join('')}</div>`;
      }catch(e){}
      VIEW.innerHTML=`<div class="card fade center">
          <div style="font-size:46px">✅</div>
          <h3 style="margin:6px 0 2px">บันทึกคะแนนเรียบร้อย</h3>
          <p class="tiny muted" style="margin:0 0 14px">ขอบคุณ ${esc(ident.player_name)} — รอเพื่อนที่เหลือให้คะแนน</p>
          <div class="bigscore" style="font-size:36px">${done} <small>/ ${total} Players Completed</small></div>
          <div class="bar" style="margin:14px 0 6px"><i style="width:${total?done/total*100:0}%"></i></div>
          <div class="plist" style="margin-top:14px">${r.map(x=>`<div class="prow" style="cursor:default">
            ${avatar(x.name,'sm')}<div class="nm">${esc(x.name)}</div>
            <div class="tail"><span class="dot ${x.has_submitted?'':'wait'}"></span>
            <span class="tiny muted">${x.has_submitted?'เสร็จแล้ว':'กำลังให้คะแนน'}</span></div></div>`).join('')}</div>
        </div>${liveHtml}
        ${isHost?`<div class="card fade"><div class="btn-row"><button class="btn btn-navy btn-lg" id="bFin">
          <i data-lucide="flag"></i> จบการให้คะแนน & ดูผลเลย</button></div>
          <p class="tiny muted center" style="margin:10px 0 0">ใช้เมื่อมีเพื่อนบางคนไม่สะดวกให้คะแนน</p></div>`:''}`;
      icons();
      if($('#bFin')) $('#bFin').onclick=async()=>{ try{ await API.setStatus(cur.id,myToken(),'completed');
        toast('ปิดรอบการให้คะแนนแล้ว ✓','ok'); go('#/result/'+code); }catch(e){ toast(errText(e),'err'); } };
    };
    await draw();
    unsub=API.subscribe(s.id,()=>draw());
  }
}

async function PageHistory(){
  setTop('ประวัติการเล่น','ทุก Session ที่ผ่านมา');
  const [sessions, rows] = await Promise.all([API.sessions(), API.allScores()]);
  const byS={}; rows.forEach(r=>{ byS[r.session_id]=byS[r.session_id]||[]; byS[r.session_id].push(r); });
  const list=sessions.filter(s=>byS[s.id]?.length);
  if(!list.length){ VIEW.innerHTML=`<div class="card"><div class="empty"><div class="em">🗓</div>
    <b>ยังไม่มีประวัติ</b><div class="tiny">เมื่อเล่นและให้คะแนนครบ Session จะมาแสดงที่นี่</div>
    <div class="btn-row"><button class="btn btn-primary" onclick="go('#/create')">สร้าง Session แรก</button></div></div></div>`; return; }
  VIEW.innerHTML=list.map(s=>{
    const r=byS[s.id]; const avg=r.reduce((a,x)=>a+num(x.overall),0)/r.length;
    const top=r.slice().sort((a,b)=>b.overall-a.overall)[0];
    return `<div class="card fade" style="padding:14px;cursor:pointer" onclick="go('#/history/${s.session_code}')">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="av" style="background:linear-gradient(135deg,var(--navy),var(--blue));font-size:17px">🏸</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:14.5px">${esc(s.name)}</div>
          <div class="tiny muted">${fmtDate(s.date)} · ${esc(s.venue||'-')} · ${r.length} ผู้เล่น</div>
          <div class="tiny" style="color:var(--green);font-weight:700;margin-top:2px">🥇 ${esc(top.player_name)} ${f1(top.overall)}</div>
        </div>
        <div style="text-align:right"><div style="font-family:Inter;font-size:21px;font-weight:800">${f1(avg)}</div>
          <div class="tiny muted">เฉลี่ย</div></div>
        <i data-lucide="chevron-right" style="color:#CBD5E1"></i></div></div>`;
  }).join('');
  icons();
}

    <div class="card fade"><div class="card-hd"><i data-lucide="history" style="color:var(--blue)"></i><h3>ประวัติ Session</h3></div>
      ${a.hist.slice().reverse().map(h=>`<div class="rankrow" onclick="go('#/history/${h.code}')">
        <div class="av sm" style="background:${avColor(h.name)}">🏸</div>
        <div><div class="nm" style="font-weight:700">${esc(h.name)}</div><div class="tiny muted">${fmtDate(h.date)}</div></div>
        <div class="sc">${f1(h.overall)}</div></div>`).join('')}</div>`;
  icons();
  radarChart('radar',a);
  lineChart('prog', a.hist.map(h=>fmtDateShort(h.date)), a.hist.map(h=>Math.round(h.overall*100)/100));
}

/* ---------- RANKING ---------- */
async function PageRanking(){
  setTop('Ranking','อันดับคะแนนเฉลี่ยรวม');
  const rows=await API.allScores(); const agg=aggregateByPlayer(rows);
  const qualified=agg.filter(a=>a.sessions>=3), pending=agg.filter(a=>a.sessions<3);
  if(!agg.length){ VIEW.innerHTML=`<div class="card"><div class="empty"><div class="em">🏆</div>
    <b>ยังไม่มีอันดับ</b><div class="tiny">เล่นและให้คะแนนให้ครบอย่างน้อย 3 Sessions</div></div></div>`; return; }
  const podium=qualified.slice(0,3);
  VIEW.innerHTML=`<div class="hero fade center"><h2>🏆 อันดับคะแนนเฉลี่ย</h2>
      <p>คำนวณจากทุก Session · ต้องมีอย่างน้อย 3 Sessions</p></div>
    ${podium.length?`<div class="card fade"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px;align-items:end">
      ${[1,0,2].map(i=>{ const x=podium[i]; if(!x) return '<div></div>';
        const h=[86,110,72][i===0?1:i===1?0:2];
        return `<div style="text-align:center;cursor:pointer" onclick="go('#/player/${x.player_id}')">
          <div style="display:flex;justify-content:center;margin-bottom:6px">${avatar(x.player_name,i===0?'lg':'')}</div>
          <div style="font-weight:800;font-size:13px">${esc(x.player_name)}</div>
          <div style="font-family:Inter;font-size:19px;font-weight:800;color:var(--blue)">${f1(x.overall)}</div>
          <div style="height:${h}px;margin-top:7px;border-radius:14px 14px 0 0;display:grid;place-items:start center;padding-top:9px;font-size:23px;
            background:linear-gradient(180deg,${i===0?'#FDE68A,#F59E0B':i===1?'#E2E8F0,#94A3B8':'#FED7AA,#EA580C'})">${medal(i)}</div>
        </div>`;}).join('')}</div></div>`:''}
    <div class="card fade"><div class="card-hd"><i data-lucide="list-ordered" style="color:var(--blue)"></i><h3>Overall Ranking</h3></div>
      ${qualified.length?qualified.map((x,i)=>`<div class="rankrow ${i<3?'top':''}" onclick="go('#/player/${x.player_id}')">
        <div class="pos">${medal(i)}</div>${avatar(x.player_name,'sm')}
        <div style="min-width:0"><div class="nm" style="font-weight:700">${esc(x.player_name)}</div>
          <div class="tiny muted">${x.sessions} Sessions · ${levelOf(x.overall).n}</div></div>
        <div class="tail" style="margin-left:auto;display:flex;align-items:center;gap:9px">
          ${levelBadge(x.overall)}<div class="sc">${f1(x.overall)}</div></div></div>`).join('')
        :`<div class="empty"><div class="em">⏳</div><b>ยังไม่มีใครครบ 3 Sessions</b></div>`}</div>
    ${pending.length?`<div class="card fade"><div class="card-hd"><i data-lucide="hourglass" style="color:#94A3B8"></i>
      <h3>ยังไม่เข้าเกณฑ์ (&lt; 3 Sessions)</h3></div>
      ${pending.map(x=>`<div class="rankrow" onclick="go('#/player/${x.player_id}')"><div class="pos">–</div>
        ${avatar(x.player_name,'sm')}<div><div class="nm" style="font-weight:700">${esc(x.player_name)}</div>
        <div class="tiny muted">${x.sessions}/3 Sessions</div></div>
        <div class="sc" style="color:#94A3B8">${f1(x.overall)}</div></div>`).join('')}</div>`:''}`;
  icons();
}
